wear-complications-data = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "wearableComplications" }
wear-complications-rendering = { group = "androidx.wear.watchface", name = "watchface-complications-rendering", version.ref = "wearableComplications" }
wear-input = { group = "androidx.wear", name = "wear-input", version.ref = "wearInput" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
